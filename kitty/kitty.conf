# ╔══════════════════════════════════════════════════════╗
# ║   Kitty Terminal — Vivid Red/Pink on Mocha Dark      ║
# ║   Palette: #E93A46 · #F07080 · #FAF0E6 · #1E1E2E    ║
# ╚══════════════════════════════════════════════════════╝
# ── Palette reference ────────────────────────────────────────────────────────
#   Red        #E93A46   — primary accent (vivid, your GTK accent)
#   Pink       #F07080   — secondary accent (lighter tint of E93A46)
#   Warm white #FAF0E6   — foreground / text
#   Dark bg    #1E1E2E   — Mocha base
#   Deep bg    #11111B   — Mocha crust (tab bar, inactive areas)
# ─────────────────────────────────────────────────────────────────────────────
# Place this file at: ~/.config/kitty/kitty.conf


# ─── Font ────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size        12.0

# Ligature support (great for JetBrains Mono)
disable_ligatures never

# Fine-tune glyph rendering
adjust_line_height  2
adjust_column_width 0


# ─── Colors ───────────────────────────────────────────────────────────────────

# Base
foreground              #FAF0E6
background              #0D0D0D
selection_foreground    #1E1E2E
selection_background    #E93A46

# Cursor — vivid red, warm white text inside
cursor                  #E93A46
cursor_text_color       #FAF0E6

# URL underline
url_color               #F07080

# Window borders
active_border_color     #E93A46
inactive_border_color   #45475A
bell_border_color       #F07080

# Tab bar
active_tab_foreground   #FAF0E6
active_tab_background   #E93A46
inactive_tab_foreground #9399B2
inactive_tab_background #181825
tab_bar_background      #11111B

# ── 16 terminal colors ───────────────────────────────────────────────────────
# black
color0   #0D0D0D
color8   #1A1A1A

# red (vivid red primary, pink as bright variant)
color1   #E93A46
color9   #F07080

# green (Mocha green — good contrast)
color2   #A6E3A1
color10  #A6E3A1

# yellow
color3   #F9E2AF
color11  #F9E2AF

# blue
color4   #89B4FA
color12  #89B4FA

# magenta — pink ties into your palette
color5   #F07080
color13  #E93A46

# cyan
color6   #94E2D5
color14  #94E2D5

# white — warm white
color7   #FAF0E6
color15  #FFFFFF

# Extended
color16  #E93A46
color17  #F07080


# ─── Window ──────────────────────────────────────────────────────────────────

background_opacity          0.85
dynamic_background_opacity  yes

window_padding_width        10
window_margin_width         0
placement_strategy          center

hide_window_decorations     no
resize_in_steps             yes

# Slightly rounded window feel
draw_minimal_borders        yes
window_border_width         1pt


# ─── Cursor ──────────────────────────────────────────────────────────────────

cursor_shape            beam
cursor_beam_thickness   1.5
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0
cursor_trail 10
cursor_trail_decay 0.1 0.5
cursor_trail_start_threshold 1


# ─── Scrollback ──────────────────────────────────────────────────────────────

scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER


# ─── Tab Bar ─────────────────────────────────────────────────────────────────

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "


# ─── Mouse ───────────────────────────────────────────────────────────────────

mouse_hide_wait         3.0
url_style               curly
open_url_with           default
copy_on_select          no


# ─── Performance ─────────────────────────────────────────────────────────────

repaint_delay           10
input_delay             3
sync_to_monitor         yes


# ─── Bell ────────────────────────────────────────────────────────────────────

enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes


# ─── Shell & Startup ─────────────────────────────────────────────────────────

shell                   .
editor                  .
close_on_child_death    no
allow_remote_control    no
startup_session         none


# ─── Key Bindings ────────────────────────────────────────────────────────────

# New tab / window
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+n    new_window_with_cwd

# Navigate tabs
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+q        close_tab

# Font size
map ctrl+equal      change_font_size all +1.0
map ctrl+minus      change_font_size all -1.0
map ctrl+0          change_font_size all 0

# Clipboard
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

# Scrollback
map ctrl+shift+k    scroll_line_up
map ctrl+shift+j    scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
