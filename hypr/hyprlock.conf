# ==============================================================================
# HYPRLOCK CONFIGURATION
# Colors: #e93a46, Red, Pinkish #e93a46 (#f05a6d), White
# ==============================================================================

general {
    disable_loading_bar = true
    immediate_render = true
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 500
    fractional_scaling = 2
}

# --- BACKGROUND & BLUR ---
background {
    monitor =
    path = ~/.config/wallpapers/kaneki_laying.jpg
    blur_passes = 3       # 0 disables blurring
    blur_size = 4
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgb(233, 58, 70) # My primary hex #e93a46
    font_size = 112
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4
    
    position = 0, 35%
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = white
    font_size = 112
    font_family = Geist Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 22%
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgb(240, 90, 109)
    font_size = 25
    font_family = JetBrains Mono Nerd Font 10
    
    position = 0, 35
    halign = center
    valign = center
}

# Day
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%b %d')" </b>"
    color = white
    font_size = 18
    font_family = JetBrainsMono Nerd Font 10

    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 25
    outer_color = rgb(233,58,70)
    inner_color = black
    font_color = black
	  check_color = green
	  fail_color = red
    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    position = 0, 20%
    halign = center
    valign = bottom
}

# SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/waybar/scripts/songdetails.sh)"
    color = rgb(233, 58, 70)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 2%
    halign = center
    valign = bottom
}
