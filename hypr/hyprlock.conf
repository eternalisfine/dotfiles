# ==============================================================================
# HYPRLOCK CONFIGURATION
# Colors: #e93a46, Red, Pinkish #e93a46 (#f05a6d), White
# ==============================================================================

general {
    disable_loading_bar = true
    immediate_render = true
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 500
    fractional_scaling = 2
}

# --- BACKGROUND & BLUR ---
background {
    monitor =
    # IMPORTANT: Replace this with the actual path to your wallpaper!
    path = ~/.config/wallpapers/spider_lily_tokyo_ghoul.png   
    
    # Blur settings
    blur_passes = 3       # 0 disables blurring
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- TIME ---
label {
    monitor =
    text = $TIME
    color = rgb(233, 58, 70) # Your primary hex #e93a46
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    
    position = 0, -150
    halign = center
    valign = top
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = rgb(255, 255, 255) # White
    font_size = 25
    font_family = JetBrains Mono Nerd Font Bold
    
    position = 0, -320
    halign = center
    valign = top
}

# --- USER GREETING ---
label {
    monitor =
    text =    $USER
    color = rgb(240, 90, 109) # Slightly pinkish version (#f05a6d)
    font_size = 22
    font_family = JetBrains Mono Nerd Font Bold
    
    position = 0, 60
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 3
    
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    # Normal State Colors
    outer_color = rgb(233, 58, 70) # Your primary hex #e93a46
    inner_color = rgba(255, 255, 255, 0.1) # Very transparent white background
    font_color = rgb(255, 255, 255) # White typing text
    
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = -1
    
    # Validation Colors
    check_color = rgb(240, 90, 109) # Pinkish version while checking
    fail_color = rgb(255, 0, 0)     # Pure red on failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -20
    halign = center
    valign = center
}
