# ==============================================================================
# HYPRLOCK CONFIGURATION
# Colors: #e93a46, Red, Pinkish #e93a46 (#f05a6d), White
# ==============================================================================
source = ~/.config/themes/current/hyprlock.conf

general {
    disable_loading_bar = true
    immediate_render = true
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 500
    fractional_scaling = 2
}

# --- BACKGROUND & BLUR ---
background {
    monitor =
    path = ~/.config/themes/current/active_wallpaper
    blur_passes = 1     # 0 disables blurring
    blur_size = 4
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<i><big> $(date +"%H") </big></i>"
    color = $accent # My primary hex #e93a46
    font_size = 225
    font_family = SF Pro Display #RecMonoCasualNerdFont
    shadow_passes = 3
    shadow_size = 4
    
    position = -3%, 27%
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<big> $(date +"%M") </big>"
    color = $text_white
    font_size = 60
    font_family = JetBrainsMono Nerd Font #FreeSerif

    shadow_passes = 3
    shadow_size = 4

    position = 6%, 13%
    halign = center
    valign = center
}

# Day
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big><i> "$(date +'%A')" </i></big></b>"
    color = $accent_alt
    font_size = 25
    font_family = ElmsSans
    
    position = -300, 0
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(date +'%b %d')" </b>"
    color = $text_white
    font_size = 23
    font_family = MonaspiceRnNerdFont

    position = 225, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1
    rounding = 27
    outer_color = $input_outer
    inner_color = $input_inner
    font_color = $input_font
    check_color = $check_color
    fail_color = $fail_color
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Enter Password</i>
    hide_input = false
    font_family = SF Pro Display
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0,0,0,0.25)
    shadow_boost = 1.1
    position = 0, 25%
    halign = center
    valign = bottom
}

# SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/waybar/scripts/songdetails.sh)"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 2%
    halign = center
    valign = bottom
}

# Battery Status
label {
    monitor =
    text = cmd[update:10000] echo "  $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = $battery_fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font 10
    position = -15, 15
    halign = right
    valign = bottom
  }
