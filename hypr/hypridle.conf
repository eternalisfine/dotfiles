general {
    lock_cmd = pidof hyprlock || hyprlock         # fallback: catches anything that fires a dbus lock event (loginctl lock-session, a power-menu button, etc.)
    before_sleep_cmd = loginctl lock-session; pidof hyprlock || hyprlock   # ask logind AND launch hyprlock directly - suspend can't race ahead of an unregistered session
    after_sleep_cmd = hyprctl dispatch dpms on    # avoid needing to press a key twice to wake the display
    inhibit_sleep = 3                             # wait for hyprlock to actually render before letting the system sleep
    ignore_dbus_inhibit = false                   # respect idle-inhibit requests from e.g. media players, browsers in fullscreen
    ignore_systemd_inhibit = false
}

listener {
    timeout = 300                                 # 5 min
    on-timeout = pidof hyprlock || hyprlock        # called directly - doesn't depend on logind session registration
}

listener {
    timeout = 600                                 # 10 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
